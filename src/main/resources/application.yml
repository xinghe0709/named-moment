spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: named-moment
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/named_moment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: always
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 2s
    openai:
      api-key: ${AI_API_KEY:not-configured}
      base-url: ${AI_BASE_URL:http://127.0.0.1:8000/v1}
      chat:
        options:
          model: ${AI_CHAT_MODEL:Qwen3.6-35B-A3B-4bit}
          temperature: 0.2
          extra-body:
            enable_thinking: false
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:Qwen3-Embedding-0.6B-8bit}
          dimensions: 512
    tools:
      throw-exception-on-error: true
      limits:
        max-calls-per-tool:
          searchEmotionConcepts: 2
        max-total-tool-calls: 2
        on-limit-exceeded: THROW

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level ${PID:- } --- [${spring.application.name}] [%thread] [requestId=%X{requestId:-startup}] %logger{40} : %msg%n%wEx"
  level:
    com.example.namedmoment: INFO
