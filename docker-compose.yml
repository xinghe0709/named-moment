services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: named-moment-postgres
    environment:
      POSTGRES_DB: named_moment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - named_moment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d named_moment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  named_moment_pgdata:
